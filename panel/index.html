<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>factory</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --text: #1d2330; --muted: #5d6677;
  --border: #e2e6ec; --accent: #4f46e5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --gray: #6b7280; --gray-bg: #eef0f3;
  --blue: #1d4ed8; --blue-bg: #e3ebff;
  --amber: #b45309; --amber-bg: #fdf0d9;
  --violet: #7c3aed; --violet-bg: #efe7ff;
  --green: #15803d; --green-bg: #dcf5e4;
  --red: #b91c1c; --red-bg: #fde4e4;
  --pink: #be185d; --pink-bg: #fce7f3;
  --orange: #c2410c; --orange-bg: #ffedd5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1219; --surface: #171b24; --surface-2: #1e2330; --text: #e6e9ef; --muted: #9aa3b5;
    --border: #2a3040; --accent: #8b85ff; --shadow: none;
    --gray: #a3aab8; --gray-bg: #262c39;
    --blue: #8fb0ff; --blue-bg: #1c2a4d;
    --amber: #f5c46b; --amber-bg: #3a2c12;
    --violet: #c4a7ff; --violet-bg: #2e2247;
    --green: #77d99a; --green-bg: #15301f;
    --red: #ff9b9b; --red-bg: #3d1a1a;
    --pink: #f9a8d4; --pink-bg: #3b1729;
    --orange: #fdba74; --orange-bg: #3b2113;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
nav.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
nav.tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.spacer { flex: 1; }
.alert { border: 0; cursor: pointer; background: var(--red-bg); color: var(--red); padding: 5px 12px; border-radius: 99px; font-weight: 600; }
.working-badge { border: 0; cursor: pointer; background: var(--amber-bg); color: var(--amber); padding: 5px 12px; border-radius: 99px; font-weight: 600; }
.live { color: var(--muted); font-size: 12px; white-space: nowrap; }
.live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.live.down i { background: var(--red); }

main { max-width: 1280px; margin: 0 auto; padding: 20px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
h2:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.c-gray { color: var(--gray); background: var(--gray-bg); }
.c-blue { color: var(--blue); background: var(--blue-bg); }
.c-amber { color: var(--amber); background: var(--amber-bg); }
.c-violet { color: var(--violet); background: var(--violet-bg); }
.c-green { color: var(--green); background: var(--green-bg); }
.c-red { color: var(--red); background: var(--red-bg); }
.c-pink { color: var(--pink); background: var(--pink-bg); }
.c-orange { color: var(--orange); background: var(--orange-bg); }

.button { border: 1px solid var(--border); background: var(--surface); padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; text-decoration: none; color: var(--text); white-space: nowrap; }
.button:hover { border-color: var(--accent); color: var(--accent); }
.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Product */
.project-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.milestone { margin-top: 14px; }
.milestone-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.milestone-head h3 { margin: 0; font-size: 17px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--green); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; }
.feature h4 { margin: 2px 0 8px; font-size: 15px; cursor: pointer; }
.feature h4:hover { color: var(--accent); }
.feature.waiting { border-color: var(--red); }
.oks { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 4px; }
.oks li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.oks li.yes { color: var(--text); }
.oks .tick { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; border: 1.5px solid var(--border); }
.oks li.yes .tick { background: var(--green); border-color: var(--green); color: #fff; }
.oks li.now .tick { border-color: var(--red); color: var(--red); }
.table { width: 100%; border-collapse: collapse; }
.table td, .table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { font-size: 12px; color: var(--muted); font-weight: 600; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }

/* Construction */
.attention { border-color: var(--red); }
.attention + .attention { margin-top: 10px; }
.question { background: var(--surface-2); border-radius: 8px; padding: 4px 14px; margin-top: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plain-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plain-list li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

.agents { display: grid; gap: 6px; }
.agent { border-left: 4px solid var(--role); padding: 0; overflow: hidden; }
.agent .agent-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; color: var(--role); min-width: 0; }
.agent .agent-head:hover { background: var(--surface-2); }
.agent .agent-head b { font-size: 14px; color: var(--text); flex: none; }
.agent .agent-head .ids { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.agent .agent-head .when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
.agent .agent-head .caret { color: var(--muted); font-size: 11px; transition: transform .15s; flex: none; }
.agent.open .agent-head .caret { transform: rotate(90deg); }
.agent .details { display: none; padding: 0 12px 12px 29px; }
.agent.open .details { display: block; }
.agent ul { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 4px; }
.agent li { cursor: pointer; }
.agent li:hover .title-link { color: var(--accent); }
.agent .action { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.agent .meta-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
.agent.stale { border-left-style: dashed; }
.agent.stale .pulse { animation: none; opacity: .4; }
.agent .stale-icon { display: none; color: var(--red); flex: none; }
.agent.stale .stale-icon { display: inline; }
.agent.stale .agent-head .when { color: var(--red); }
.agent .warn { margin-top: 8px; font-size: 12px; color: var(--red); }
.side-stack h2:not(:first-child) { margin-top: 20px; }
.role-orchestrator { --role: var(--violet); } .role-analyst { --role: var(--blue); } .role-prototyper { --role: var(--pink); }
.role-architect { --role: var(--orange); } .role-developer { --role: var(--green); } .role-validator { --role: var(--red); }

.selector { display: flex; gap: 6px; flex-wrap: wrap; }
.selector button { border: 1px solid var(--border); background: var(--surface); padding: 4px 12px; border-radius: 99px; cursor: pointer; }
.selector button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.feature-progress { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.feature-progress .card { padding: 10px 12px; cursor: pointer; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.column { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 120px; }
.column h5 { margin: 2px 4px 10px; font-size: 13px; display: flex; justify-content: space-between; }
.task { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.task:hover { border-color: var(--accent); }
.task.working { border-left: 3px solid var(--amber); }
.task.waiting { border-left: 3px solid var(--red); }
.task.blocked { border-left: 3px solid var(--red); background: var(--red-bg); }
.task .title { font-weight: 600; margin: 2px 0 6px; }
.task .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }

/* Side panel */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 9; }
aside.side { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 10;
  border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
.side-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.side-head h3 { margin: 0; font-size: 17px; flex: 1; }
.side-tabs { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.side-tabs .active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.side-body { padding: 6px 22px 30px; overflow-y: auto; flex: 1; }
.close { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }

.md h1 { font-size: 20px; } .md h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 22px 0 8px; }
.md h3 { font-size: 14px; }
.md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.md pre { background: var(--surface-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
pre.plain { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; }

/* Decisions in "waiting for you" */
.decide { margin-top: 12px; display: grid; gap: 10px; }
.decide .row { gap: 6px; }
.decide .q { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.decide .q-title { font-weight: 600; margin-bottom: 8px; }
.opt { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: 13px; }
.opt:hover { border-color: var(--accent); }
.opt.rec { border-color: var(--accent); }
.opt.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.opt small { display: block; color: inherit; opacity: .75; font-size: 11px; }
.comment { display: grid; gap: 6px; }
.comment textarea { font: inherit; width: 100%; min-height: 64px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface); color: var(--text); resize: vertical; }
.button.danger { color: var(--red); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.icon-button { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 4px 10px; cursor: pointer; font-size: 13px; }

/* Orchestrator dock */
body { padding-bottom: 56px; }
body.dock-open { padding-bottom: 330px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: #11151d; color: #d7dce5; border-top: 1px solid #2a3040;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; box-shadow: 0 -6px 18px rgba(0,0,0,.18); }
.dock-bar { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; }
.dock-bar b { color: #b9b4ff; font-weight: 600; }
.dock-bar .last { color: #8a93a6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.dock-bar .unread { background: #8b85ff; color: #11151d; border-radius: 99px; padding: 0 8px; font-weight: 700; }
.dock-bar .caret { color: #8a93a6; transition: transform .15s; }
.dock.open .dock-bar .caret { transform: rotate(180deg); }
.dock-body { display: none; height: 274px; border-top: 1px solid #2a3040; grid-template-rows: 1fr auto; }
.dock.open .dock-body { display: grid; }
.dock-log { overflow-y: auto; padding: 10px 20px; display: grid; gap: 6px; align-content: start; }
.dock-log .m { white-space: pre-wrap; overflow-wrap: anywhere; }
.dock-log .who { color: #b9b4ff; margin-right: 6px; }
.dock-log .m.user .who { color: #77d99a; }
.dock-log .m.event { color: #8a93a6; font-style: italic; }
.dock-log .t { color: #5d6677; margin-right: 8px; }
.dock-input { display: flex; gap: 8px; padding: 10px 20px; border-top: 1px solid #2a3040; }
.dock-input input { flex: 1; font: inherit; background: #1b2130; color: #e6e9ef; border: 1px solid #2a3040; border-radius: 6px; padding: 8px 10px; }
.dock-input input:focus { outline: 1px solid #8b85ff; }
.dock-input button { font: inherit; background: #8b85ff; color: #11151d; border: 0; border-radius: 6px; padding: 0 14px; font-weight: 700; cursor: pointer; }

@media (max-width: 760px) {
  main { padding: 16px; }
  header.top { padding: 10px 16px; }
  .project-head, .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="name">factory</b><span id="subtitle"></span></div>
  <nav class="tabs">
    <button data-view="product"></button>
    <button data-view="construction"></button>
  </nav>
  <div class="spacer"></div>
  <span id="badge-slot"></span>
  <button class="icon-button" id="sound" onclick="toggleSound()"></button>
  <span class="live" id="live"><i></i>…</span>
</header>
<main id="view"></main>
<div id="side-slot"></div>
<div class="toast" id="toast"></div>
<div class="dock" id="dock">
  <div class="dock-bar" onclick="toggleDock()"><span>›_</span><b id="dock-title"></b><span class="last" id="dock-last"></span>
    <span class="unread" id="dock-unread" hidden></span><span class="caret">▲</span></div>
  <div class="dock-body">
    <div class="dock-log" id="dock-log"></div>
    <form class="dock-input" onsubmit="sendMessage(event)"><input id="dock-input" autocomplete="off"><button id="dock-send"></button></form>
  </div>
</div>

let lang = "es", T = I18N.es, LB = LABELS.es;
let state = null, signature = "", selectedMilestone = null, side = null;
let view = ["product", "construction"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "product";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (key, vars = {}) => (T[key] || key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
const md = text => window.marked ? marked.parse(text || "") : `<pre class="plain">${esc(text)}</pre>`;
const chip = pair => pair ? `<span class="chip c-${pair[1]}">${esc(pair[0])}</span>` : "";
const itemsOf = type => state.items.filter(e => e.meta.type === type);
const byId = id => id === "project" ? state.project : id === "design" ? state.design : state.items.find(e => e.meta.id === id);
const agentLabel = a => LB.agent[a] || a;
const phaseLabel = m => ({ feature: LB.feature_phase, milestone: LB.milestone_phase, task: LB.task_phase, design: LB.design_phase }[m.type] || {})[m.phase] || (m.phase ? [m.phase, "gray"] : null);
const titleOf = e => e ? (e.meta.title || e.meta.name || t("project")) : "";
const section = (body, title) => {
  const m = (body || "").match(new RegExp(`^## ${title}\\s*$([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, "m"));
  return m ? m[1].trim() : "";
};
const localizeHeadings = body => (body || "").replace(/^## (Description|Pending questions|Resolved questions|History)\s*$/gm, (_, h) => `## ${LB.section[h]}`);

function duration(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return `${s} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min`;
  return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`;
}
const secondsSince = iso => (Date.now() - Date.parse(iso)) / 1000;

async function load() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const txt = await r.text();
    $("#live").className = "live";
    if (txt !== signature) {
      signature = txt;
      state = JSON.parse(txt);
      lang = state.language === "en" ? "en" : "es";
      T = I18N[lang]; LB = LABELS[lang];
      render();
    }
    $("#live").innerHTML = `<i></i>${esc(t("live"))} · ${esc(state.generated.slice(11))}`;
  } catch (e) {
    $("#live").className = "live down";
    $("#live").innerHTML = `<i></i>${esc(t("offline"))}`;
  }
}

function render() {
  const p = state.project.meta;
  document.documentElement.lang = lang;
  document.title = `${p.name || t("project")} · factory`;
  $("#name").textContent = p.name || t("project");
  $("#subtitle").textContent = p.description || t("panel");
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.textContent = t(b.dataset.view);
    b.classList.toggle("active", b.dataset.view === view);
  });
  const pending = [state.project, state.design, ...state.items].filter(e => ["waiting_human", "blocked"].includes(e.meta.status));
  const working = state.activity.agents.length;
  $("#badge-slot").innerHTML =
    (working ? `<button class="working-badge" onclick="goTo('construction')">● ${working} ${esc(t(working === 1 ? "agents_one" : "agents_many"))}</button> ` : "") +
    (pending.length ? `<button class="alert" onclick="goTo('construction')">${pending.length} ${esc(t(pending.length === 1 ? "alert_one" : "alert_many"))}</button>` : "");
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.draft : null;
  const caret = focused ? document.activeElement.selectionStart : 0;
  $("#view").innerHTML = view === "product" ? productView() : constructionView(pending);
  if (focused) { const el = document.querySelector(`[data-draft="${CSS.escape(focused)}"]`); if (el) { el.focus(); el.setSelectionRange(caret, caret); } }
  renderDock();
  renderSound();
  checkAlert(pending.length);
  tick();
  if (side) openSide(side.id, side.tab, true);
}

function goTo(v) { view = v; location.hash = v; render(); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => goTo(b.dataset.view));

const opensInTab = (e, k) => /\.html$/.test((e.artifacts || {})[k] || "");
function artifactButtons(e) {
  return Object.keys(e.artifacts || {}).map(k =>
    opensInTab(e, k)
      ? `<a class="button" href="/artifact/${esc(e.artifacts[k])}" target="_blank">${esc(LB.artifact[k] || k)}</a>`
      : `<button class="button" onclick="event.stopPropagation(); openSide('${esc(e.meta.id)}', '${k}')">${esc(LB.artifact[k] || k)}</button>`
  ).join("");
}
function prButton(e) {
  const pr = e.meta.pr;
  return pr && state.prs_url ? `<a class="button primary" href="${esc(state.prs_url + pr)}" target="_blank" onclick="event.stopPropagation()">${esc(t("open_pr", { n: pr }))}</a>` : "";
}

/* ------------------------------------------------------------------ Product */
function productView() {
  const pr = state.project, p = pr.meta, d = state.design.meta;
  const stack = section(pr.body, "Stack");
  const steps = [[t("discovery"), p.discovery === "done"], [t("architecture_base"), p.architecture === "done"]];
  if (d.level && d.level !== "none") steps.push([`${t("design_kit")}${d.level === "guidelines" ? ` (${t("guidelines")})` : ""}`, d.phase === "approved"]);
  let h = `<h2>${esc(t("product"))}</h2>
  <div class="card project-head">
    <div>
      <div class="row">${steps.map(([label, ok]) => chip([`${ok ? "✓" : "○"} ${label}`, ok ? "green" : "gray"])).join("")}
        ${chip([p.interface ? `${t("interface")}: ${p.interface}` : t("interface_unset"), "gray"])}
        ${chip([p.remote === "github" ? t("github") : t("local"), "gray"])}
        ${chip([`${t("language")}: ${lang}`, "gray"])}
        ${d.level === "none" ? chip([t("no_design"), "gray"]) : ""}</div>
      ${stack && !stack.startsWith("_") ? `<div class="md">${md(stack)}</div>` : `<p class="muted">${esc(t("stack_pending"))}</p>`}
    </div>
    <div class="row">${artifactButtons(pr)}${artifactButtons(state.design)}<button class="button" onclick="openSide('project')">${esc(t("profile"))}</button></div>
  </div>`;

  const milestones = itemsOf("milestone");
  if (!milestones.length) h += `<h2>${esc(t("milestones"))}</h2><div class="empty">${esc(t("no_milestones"))}</div>`;
  for (const m of milestones) {
    const fs = itemsOf("feature").filter(f => f.meta.milestone === m.meta.id);
    const alive = fs.filter(f => !["postponed", "discarded"].includes(f.meta.phase));
    const accepted = alive.filter(f => f.meta.phase === "accepted").length;
    h += `<div class="milestone">
      <h2>${esc(m.meta.id)} · ${esc(t("milestone"))}</h2>
      <div class="milestone-head"><h3>${esc(m.meta.title)}</h3>${chip(phaseLabel(m.meta))}
        ${m.meta.status === "waiting_human" ? chip([t("waiting_prefix") + m.meta.reason, "red"]) : ""}
        <span class="spacer"></span>${prButton(m)}${artifactButtons(m)}
        <button class="button" onclick="openSide('${m.meta.id}')">${esc(t("card"))}</button></div>
      <div class="muted">${esc(t("goal"))} ${esc(m.meta.goal || "—")}</div>
      <div class="row" style="margin-top:8px"><div class="bar" style="flex:1"><div style="width:${alive.length ? accepted / alive.length * 100 : 0}%"></div></div>
        <span class="muted">${esc(t("accepted_count", { a: accepted, b: alive.length }))}</span></div>
      <div class="grid">${fs.map(featureCard).join("") || `<div class="empty">${esc(t("no_features"))}</div>`}</div>
    </div>`;
  }

  h += `<h2>${esc(t("decisions"))}</h2>`;
  h += state.decisions.length ? `<div class="card" style="padding:0"><table class="table">
    <tr><th>ID</th><th>${esc(t("th_decision"))}</th><th>${esc(t("th_about"))}</th><th>${esc(t("th_date"))}</th></tr>
    ${[...state.decisions].reverse().map(d => `<tr class="clickable" onclick="openDecision('${esc(d.meta.id)}')">
      <td class="id">${esc(d.meta.id)}</td><td>${esc(d.meta.title)}</td><td class="id">${esc(d.meta.ref || "—")}</td><td class="muted">${esc(d.meta.date)}</td></tr>`).join("")}
  </table></div>` : `<div class="empty">${esc(t("no_decisions"))}</div>`;
  return h;
}

function featureCard(f) {
  const m = f.meta, i = FEATURE_ORDER.indexOf(m.phase);
  const waiting = m.status === "waiting_human";
  const oks = [
    [t("ok_spec"), i >= 1, m.phase === "defined" && waiting],
    [t("ok_built"), i >= 3, false],
    [t("ok_accepted"), i >= 4, m.phase === "validated" && waiting],
  ];
  return `<div class="card feature ${waiting ? "waiting" : ""}">
    <div class="row"><span class="id">${esc(m.id)}</span>${chip(phaseLabel(m))}
      ${m.priority && m.priority !== "must" ? chip([LB.priority[m.priority] || m.priority, "gray"]) : ""}</div>
    <h4 onclick="openSide('${esc(m.id)}')">${esc(m.title)}</h4>
    ${waiting ? `<div>${chip([t("waiting_prefix") + (m.reason || ""), "red"])}</div>` : ""}
    <ul class="oks">${oks.map(([label, yes, now]) => `<li class="${yes ? "yes" : ""} ${now ? "now" : ""}"><span class="tick">${yes ? "✓" : now ? "!" : ""}</span>${esc(label)}</li>`).join("")}</ul>
    <div class="row"><span class="muted">${esc(f.criteria != null ? t("criteria", { n: f.criteria }) : t("not_specified"))}</span></div>
    <div class="row" style="margin-top:10px">${artifactButtons(f)}</div>
  </div>`;
}

/* ------------------------------------------------------------------ Construction */
function constructionView(pending) {
  let h = `<h2>${esc(t("waits"))}</h2>`;
  h += pending.length ? pending.map(e => {
    const m = e.meta, questions = section(e.body, "Pending questions");
    return `<div class="card attention">
      <div class="row"><span class="id">${esc(m.id)}</span>${chip(LB.status[m.status])}<b>${esc(titleOf(e))}</b>
        <span class="spacer"></span>${["approve_merge", "close_milestone"].includes(m.awaiting) ? "" : prButton(e)}${artifactButtons(e)}<button class="button" onclick="openSide('${esc(m.id)}')">${esc(t("card"))}</button></div>
      <div style="margin-top:6px">${esc(m.reason || "")}</div>
      ${questions && m.awaiting !== "answer_questions" ? `<div class="question md">${md(questions)}</div>` : ""}
      ${decisionBlock(e, questions)}
    </div>`;
  }).join("") : `<div class="empty">${esc(t("nothing_pending"))}</div>`;

  const recent = state.activity.recent.slice(0, 5);
  h += `<div class="two"><div><h2>${esc(t("working_now"))}</h2>${workingNow()}</div>
    <div class="side-stack"><h2>${esc(t("next_steps"))}</h2><div class="card">${state.actions.length
    ? `<ul class="plain-list">${state.actions.map(a => `<li><span class="id">${esc(a.id)}</span>
        <span>${esc(LB.mode[a.mode] || a.mode)} <span class="muted">· ${esc(agentLabel(a.who.replace("launch ", "")))}</span></span></li>`).join("")}</ul>`
    : `<span class="muted">${esc(t("nothing_next"))}</span>`}</div>
    <h2>${esc(t("recently"))}</h2><div class="card">${recent.length
    ? `<ul class="plain-list">${recent.map(r => `<li class="role-${esc(r.role)}"><b style="color:var(--role)">${esc(agentLabel(r.role))}</b>
        <span class="id">${esc((r.items || []).join(", ") || "—")}</span>
        <span class="muted small since" data-since="${esc(r.ended)}" data-fmt="ago"></span></li>`).join("")}</ul>`
    : `<span class="muted">${esc(t("nothing_recent"))}</span>`}</div></div></div>`;

  const milestones = itemsOf("milestone");
  const active = milestones.find(x => x.meta.phase === "approved") || milestones[milestones.length - 1];
  if (!selectedMilestone || !byId(selectedMilestone)) selectedMilestone = active ? active.meta.id : null;
  const hotfixes = itemsOf("task").filter(x => x.meta.kind === "hotfix");
  if (!selectedMilestone && !hotfixes.length) return h + `<h2>${esc(t("tasks"))}</h2><div class="empty">${esc(t("no_tasks_yet"))}</div>`;

  if (selectedMilestone) {
    const ms = byId(selectedMilestone);
    h += `<h2>${esc(t("milestone_h"))}</h2><div class="row">
      <div class="selector">${milestones.map(x => `<button class="${x.meta.id === selectedMilestone ? "active" : ""}" onclick="selectedMilestone='${x.meta.id}'; render()">${esc(x.meta.id)} · ${esc(x.meta.title)}</button>`).join("")}</div>
      <span class="spacer"></span>${chip(phaseLabel(ms.meta))}
      ${ms.meta.branch ? `<span class="id">${esc(ms.meta.branch)}</span>` : ""}</div>`;

    const tasks = itemsOf("task").filter(x => x.meta.milestone === selectedMilestone && x.meta.kind !== "hotfix");
    const fs = itemsOf("feature").filter(f => f.meta.milestone === selectedMilestone);
    h += `<h2>${esc(t("features"))}</h2>`;
    h += fs.length ? `<div class="feature-progress">${fs.map(f => {
      const ts = tasks.filter(x => x.meta.parent === f.meta.id && x.meta.phase !== "discarded");
      const done = ts.filter(x => x.meta.phase === "done").length;
      return `<div class="card" onclick="openSide('${esc(f.meta.id)}')">
        <div class="row"><span class="id">${esc(f.meta.id)}</span>${chip(phaseLabel(f.meta))}</div>
        <div style="margin:4px 0 6px;font-weight:600">${esc(f.meta.title)}</div>
        <div class="row"><div class="bar" style="flex:1"><div style="width:${ts.length ? done / ts.length * 100 : 0}%"></div></div>
        <span class="muted">${esc(ts.length ? t("tasks_count", { a: done, b: ts.length }) : t("no_tasks"))}</span></div></div>`;
    }).join("")}</div>` : `<div class="empty">${esc(t("no_features_in"))}</div>`;

    h += `<h2>${esc(t("tasks"))}</h2>` + kanban(tasks);
  }
  if (hotfixes.length) h += `<h2>Hotfix</h2>` + kanban(hotfixes);
  return h;
}

function actionText(a) {
  const target = a && a.target ? a.target : "";
  switch (a && a.tool) {
    case "start": return t("act_start");
    case "Edit": case "NotebookEdit": return t("act_edit", { t: target });
    case "Write": return t("act_write", { t: target });
    case "Read": return t("act_read", { t: target });
    case "Grep": case "Glob": return t("act_search", { t: target });
    case "WebFetch": case "WebSearch": return t("act_web");
    case "Agent": return t("act_agent");
    case "Bash": return target;
    default: return a && a.tool ? `${a.tool} ${target}`.trim() : "";
  }
}

const openAgents = new Set();
function toggleAgent(id) {
  openAgents.has(id) ? openAgents.delete(id) : openAgents.add(id);
  document.querySelector(`.agent[data-agent="${CSS.escape(id)}"]`)?.classList.toggle("open", openAgents.has(id));
}

function workingNow() {
  const agents = state.activity.agents;
  const listed = new Set(agents.flatMap(a => a.items || []));
  const orphans = [state.project, state.design, ...state.items].filter(e => e.meta.status === "in_progress" && !listed.has(e.meta.id));
  if (!agents.length && !orphans.length) return `<div class="empty">${esc(t("no_agents"))}</div>`;
  let h = agents.length ? `<div class="agents">${agents.map(a => {
    const items = (a.items || []).map(id => byId(id)).filter(Boolean);
    const lastSeen = a.last_seen || a.started;
    return `<div class="card agent role-${esc(a.role)} ${openAgents.has(a.id) ? "open" : ""}" data-agent="${esc(a.id)}" data-last-seen="${esc(lastSeen)}">
      <div class="agent-head" onclick="toggleAgent('${esc(a.id)}')">
        <span class="caret">▶</span><span class="pulse"></span><b>${esc(agentLabel(a.role))}</b>
        <span class="ids">${esc((a.items || []).join(", ") || "…")}</span>
        <span class="stale-icon" title="${esc(t("stale", { t: "" }))}">⚠</span>
        <span class="when since" data-since="${esc(lastSeen)}" data-fmt="ago"></span>
      </div>
      <div class="details">
        ${items.length ? `<ul>${items.map(e => `<li onclick="openSide('${esc(e.meta.id)}')"><span class="id">${esc(e.meta.id)}</span>
          <span class="title-link">${esc(titleOf(e))}</span> ${chip(phaseLabel(e.meta))}</li>`).join("")}</ul>`
          : `<p class="muted small">${esc(t("no_items_yet"))}</p>`}
        <div class="action">${esc(t("last_action"))}: ${esc(actionText(a.action))}</div>
        <div class="meta-line since" data-since="${esc(a.started)}" data-fmt="started"></div>
        <div class="warn" hidden></div>
      </div>
    </div>`;
  }).join("")}</div>` : "";
  if (orphans.length) {
    h += `<div class="card" style="margin-top:8px"><div class="muted small" style="margin-bottom:6px">${esc(t("unassigned"))}</div>
      <ul class="plain-list">${orphans.map(e => `<li style="cursor:pointer" onclick="openSide('${esc(e.meta.id)}')"><span class="pulse" style="color:var(--amber)"></span>
        <span class="id">${esc(e.meta.id)}</span><span>${esc(titleOf(e))}</span></li>`).join("")}</ul></div>`;
  }
  return h;
}

// Keeps relative times and the stale warning fresh between state refreshes.
function tick() {
  document.querySelectorAll(".since").forEach(el => {
    const s = secondsSince(el.dataset.since);
    if (!isNaN(s)) el.textContent = t(el.dataset.fmt === "started" ? "started" : "ago", { t: duration(s) });
  });
  document.querySelectorAll(".agent[data-last-seen]").forEach(el => {
    const idle = secondsSince(el.dataset.lastSeen);
    const stale = idle > STALE_SECONDS;
    el.classList.toggle("stale", stale);
    const warn = el.querySelector(".warn");
    warn.hidden = !stale;
    if (stale) warn.textContent = t("stale", { t: duration(idle) });
  });
}
setInterval(tick, 1000);

function kanban(tasks) {
  const alive = tasks.filter(x => x.meta.phase !== "discarded");
  return `<div class="kanban">${COLUMNS.map(phase => {
    const ts = alive.filter(x => x.meta.phase === phase);
    return `<div class="column"><h5>${esc(LB.task_phase[phase][0])}<span class="muted">${ts.length}</span></h5>${ts.map(taskCard).join("")}</div>`;
  }).join("")}</div>`;
}

function taskCard(task) {
  const m = task.meta;
  const cls = { in_progress: "working", waiting_human: "waiting", blocked: "blocked" }[m.status] || "";
  const pr = m.pr ? (state.prs_url ? `<a href="${esc(state.prs_url + m.pr)}" target="_blank" onclick="event.stopPropagation()">PR #${esc(m.pr)}</a>` : `PR #${esc(m.pr)}`) : "";
  const review = m.review === "ok" ? chip([t("review_ok"), "green"]) : m.review === "ko" ? chip([t("review_ko"), "red"]) : "";
  return `<div class="task ${cls}" onclick="openSide('${esc(m.id)}')">
    <div class="row"><span class="id">${esc(m.id)}</span>
      ${chip(LB.kind[m.kind])}
      ${m.status && m.status !== "queued" ? chip(LB.status[m.status]) : ""}</div>
    <div class="title">${esc(m.title)}</div>
    ${m.reason ? `<div class="muted small" style="margin-bottom:6px">${esc(m.reason)}</div>` : ""}
    <div class="meta">
      ${m.parent && m.parent !== "-" ? `<span class="id">${esc(m.parent)}</span>` : ""}
      ${m.package ? `<span>${esc(m.package)}</span>` : ""}
      ${Number(m.attempts) > 0 ? chip([t("attempt", { a: m.attempts, b: state.max_attempts }), Number(m.attempts) >= state.max_attempts ? "red" : "gray"]) : ""}
      ${review} ${pr}
      ${(m.depends_on || []).length && m.phase === "pending" ? `<span>${esc(t("depends", { x: m.depends_on.join(", ") }))}</span>` : ""}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ Decisions */
const drafts = {}, answers = {}, openComment = {};
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function parseQuestions(text) {
  const qs = [];
  for (const line of (text || "").split("\n")) {
    const q = line.match(/^\s*\*\*(P\d+)\.?\s*(.+?)\*\*/);
    if (q) { qs.push({ id: q[1], text: q[2], options: [] }); continue; }
    const o = line.match(/^\s*[-*]\s*\*\*([A-Z])\)\s*(.+?)\*\*\s*(.*)$/);
    if (o && qs.length) qs[qs.length - 1].options.push({ key: o[1], label: o[2], note: o[3].replace(/^[—–-]\s*/, ""),
      rec: /recomendad|recommended/i.test(o[3]) });
  }
  return qs;
}

function decisionBlock(e, questions) {
  const m = e.meta, id = m.id;
  const buttons = (list) => `<div class="row">${list.map(([action, label, cls]) =>
    `<button class="button ${cls || ""}" onclick="act('${esc(id)}', '${action}', this.textContent)">${esc(label)}</button>`).join("")}</div>`;
  const changes = (action = "request_changes") => openComment[id] === action
    ? `<div class="comment"><textarea data-draft="${esc(id)}:${action}" placeholder="${esc(t("changes_ph"))}" oninput="drafts[this.dataset.draft]=this.value">${esc(drafts[`${id}:${action}`] || "")}</textarea>
        <div class="row"><button class="button primary" onclick="act('${esc(id)}', '${action}', '${esc(t("request_changes"))}', drafts['${esc(id)}:${action}'])">${esc(t("send"))}</button>
        <button class="button" onclick="openComment['${esc(id)}']=null; render()">${esc(t("cancel"))}</button></div></div>`
    : `<button class="button" onclick="openComment['${esc(id)}']='${action}'; render()">${esc(t("request_changes"))}</button>`;

  switch (m.awaiting) {
    case "approve_spec":
      return `<div class="decide"><div class="row">${buttons([["approve", t("approve"), "primary"]])}${changes()}
        ${buttons([["postpone", t("postpone")], ["discard", t("discard"), "danger"]])}</div></div>`;
    case "approve_design": case "approve_milestone":
      return `<div class="decide"><div class="row">${buttons([["approve", t("approve"), "primary"]])}${changes()}</div></div>`;
    case "approve_merge":
      return `<div class="decide"><div class="row">${prButton(e)}${buttons([["merged", t("merged")]])}${changes()}</div></div>`;
    case "present_batch":
      return `<div class="decide"><div class="row">${buttons([["accept_all", t("accept_all"), "primary"], ["review_one", t("review_one")]])}${changes()}</div></div>`;
    case "close_milestone":
      return `<div class="decide"><div class="row">${prButton(e)}${buttons([["merged", t("merged")]])}</div></div>`;
    case "answer_questions": {
      const qs = parseQuestions(questions);
      if (!qs.length) break;
      const picked = answers[id] || {};
      return `<div class="decide">${qs.map(q => `<div class="q"><div class="q-title">${esc(q.id)}. ${esc(q.text)}</div>
        <div class="row">${q.options.map(o => `<button class="opt ${o.rec ? "rec" : ""} ${picked[q.id] === o.key ? "selected" : ""}"
          onclick="pick('${esc(id)}', '${q.id}', '${o.key}')"><b>${esc(o.key)})</b> ${esc(o.label)}${o.rec ? ` ★` : ""}
          ${o.note ? `<small>${esc(o.note.replace(/\*/g, ""))}</small>` : ""}</button>`).join("")}
          <button class="opt ${picked[q.id] === "other" ? "selected" : ""}" onclick="pick('${esc(id)}', '${q.id}', 'other')">${esc(t("other"))}</button></div>
        ${picked[q.id] === "other" ? `<div class="comment" style="margin-top:8px"><textarea data-draft="${esc(id)}:${q.id}" placeholder="${esc(t("other_ph"))}"
          oninput="drafts[this.dataset.draft]=this.value">${esc(drafts[`${id}:${q.id}`] || "")}</textarea></div>` : ""}</div>`).join("")}
        <div class="row"><button class="button primary" onclick="sendAnswers('${esc(id)}')">${esc(t("send_answers"))}</button></div></div>`;
    }
  }
  return `<div class="muted small" style="margin-top:8px">${esc(t("answer_terminal"))}</div>`;
}

function pick(id, q, key) { answers[id] = { ...(answers[id] || {}), [q]: key }; render(); }

function sendAnswers(id) {
  const e = byId(id), qs = parseQuestions(section(e.body, "Pending questions")), picked = answers[id] || {};
  if (qs.some(q => !picked[q.id])) { toast(t("pick_all")); return; }
  const choice = qs.map(q => picked[q.id] === "other" ? `${q.id}: ${drafts[`${id}:${q.id}`] || ""}` : `${q.id}=${picked[q.id]}`).join("; ");
  act(id, "answer", t("send_answers"), "", choice);
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Factory": "1" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
}

async function act(id, action, label, comment = "", choice = "") {
  try {
    await post("/api/action", { id, action, label, comment, choice });
    openComment[id] = null;
    toast(t("sent"));
    load();
  } catch (err) { toast(err.message || t("load_error")); }
}

function toast(text) {
  const el = $("#toast"); el.textContent = text; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ------------------------------------------------------------------ Orchestrator dock */
let dockOpen = store.get("factory.dock") === "open";
function toggleDock() {
  dockOpen = !dockOpen; store.set("factory.dock", dockOpen ? "open" : "closed");
  renderDock(true);
  if (dockOpen) $("#dock-input").focus();
}

function renderDock(scroll = false) {
  const msgs = state.conversation || [];
  const fromOrch = msgs.filter(x => x.from === "orchestrator").length;
  if (dockOpen) store.set("factory.seen", String(fromOrch));
  const unread = Math.max(0, fromOrch - Number(store.get("factory.seen") || 0));
  $("#dock").classList.toggle("open", dockOpen);
  document.body.classList.toggle("dock-open", dockOpen);
  $("#dock-title").textContent = t("orchestrator");
  $("#dock-input").placeholder = t("dock_ph");
  $("#dock-send").textContent = t("send");
  const last = [...msgs].reverse().find(x => x.from === "orchestrator");
  $("#dock-last").textContent = last ? last.text.split("\n")[0] : "";
  $("#dock-unread").hidden = !unread; $("#dock-unread").textContent = unread;
  const log = $("#dock-log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
  log.innerHTML = msgs.length ? msgs.map(x => `<div class="m ${esc(x.from)}"><span class="t">${esc((x.time || "").slice(11, 16))}</span>${
    x.from === "event" ? `• ${esc(x.text)}` : `<span class="who">${esc(x.from === "user" ? t("you") : t("orchestrator").toLowerCase())} ›</span>${esc(x.text)}`}</div>`).join("")
    : `<div class="m event">${esc(t("no_messages"))}</div>`;
  if (scroll || atBottom) log.scrollTop = log.scrollHeight;
}

async function sendMessage(ev) {
  ev.preventDefault();
  const input = $("#dock-input"), text = input.value.trim();
  if (!text) return;
  try { await post("/api/message", { text }); input.value = ""; load(); } catch (err) { toast(t("load_error")); }
}

/* ------------------------------------------------------------------ Sound */
let soundOn = store.get("factory.sound") !== "off", lastPending = null;
function toggleSound() { soundOn = !soundOn; store.set("factory.sound", soundOn ? "on" : "off"); renderSound(); if (soundOn) beep(); }
function renderSound() { $("#sound").textContent = t(soundOn ? "sound_on" : "sound_off"); }
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0], [1175, .18]].forEach(([f, at]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + at + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + at + .3);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + .32);
    });
  } catch (e) {}
}
function checkAlert(pendingCount) {
  if (lastPending !== null && pendingCount > lastPending && soundOn) beep();
  lastPending = pendingCount;
}

/* ------------------------------------------------------------------ Side panel */
async function openSide(id, tab = "card", refresh = false) {
  const e = byId(id);
  if (!e) { closeSide(); return; }
  if (tab !== "card" && opensInTab(e, tab)) { window.open(`/artifact/${e.artifacts[tab]}`, "_blank"); return; }
  side = { id, tab };
  const m = e.meta;
  const tabs = [["card", t("card")], ...Object.keys(e.artifacts || {}).map(k => [k, LB.artifact[k] || k])];
  let body;
  if (tab === "card") {
    body = itemCard(e);
  } else {
    try {
      const r = await fetch(`/artifact/${e.artifacts[tab]}`, { cache: "no-store" });
      body = `<div class="md">${md(await r.text())}</div>`;
    } catch (err) { body = `<div class="empty">${esc(t("load_error"))}</div>`; }
  }
  const scroll = refresh && $(".side-body") ? $(".side-body").scrollTop : 0;
  $("#side-slot").innerHTML = sideHtml(m, tabs, tab, body, prButton(e));
  if (refresh) $(".side-body").scrollTop = scroll;
}

function sideHtml(m, tabs, tab, body, extra = "") {
  const id = m.id;
  return `<div class="veil" onclick="closeSide()"></div>
  <aside class="side">
    <div class="side-head"><div style="flex:1"><div class="row"><span class="id">${esc(id)}</span>
      ${chip(phaseLabel(m))}
      ${m.status ? chip(LB.status[m.status]) : ""}${extra}</div>
      <h3>${esc(m.title || m.name || id)}</h3></div>
      <button class="close" onclick="closeSide()" aria-label="${esc(t("close"))}">×</button></div>
    <div class="side-tabs">${tabs.map(([k, label]) => `<button class="button ${k === tab ? "active" : ""}" onclick="openSide('${esc(id)}', '${k}')">${esc(label)}</button>`).join("")}</div>
    <div class="side-body">${body}</div>
  </aside>`;
}

function fieldValue(m, k, v) {
  if (k === "pr" && state.prs_url) return `<a href="${esc(state.prs_url + v)}" target="_blank">#${esc(v)}</a>`;
  const maps = { phase: phaseLabel(m), status: LB.status[v], kind: LB.kind[v], priority: LB.priority[v] ? [LB.priority[v]] : null,
                 level: LB.level[v] ? [LB.level[v]] : null, agent: LB.agent[v] ? [LB.agent[v]] : null };
  if (maps[k]) return esc(maps[k][0]);
  return esc(Array.isArray(v) ? v.join(", ") : v);
}

function itemCard(e) {
  const m = e.meta;
  const fields = Object.entries(m).filter(([k, v]) => !["id", "type", "title", "name"].includes(k) && v !== "" && !(Array.isArray(v) && !v.length));
  const table = `<table class="table" style="margin-top:12px">${fields.map(([k, v]) =>
    `<tr><th style="width:160px">${esc(LB.field[k] || k)}</th><td>${fieldValue(m, k, v)}</td></tr>`).join("")}</table>`;
  return table + `<div class="md">${md(localizeHeadings(e.body).replace(/^\s*# .*\n/, ""))}</div>`;
}

function openDecision(id) {
  const d = state.decisions.find(x => x.meta.id === id);
  side = null;
  $("#side-slot").innerHTML = sideHtml({ id, title: d.meta.title }, [], "",
    `<p class="muted">${esc(t("about", { x: d.meta.ref || "—", d: d.meta.date }))}</p><div class="md">${md(d.body.replace(/^\s*# .*\n/, ""))}</div>`);
}

function closeSide() { side = null; $("#side-slot").innerHTML = ""; }
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSide(); });

$("#live").innerHTML = `<i></i>${esc(t("connecting"))}`;
load();
setInterval(load, 2500);
</script>
</body>
</html>
