<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · factory</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --text: #1d2330; --muted: #5d6677;
  --border: #e2e6ec; --accent: #4f46e5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --gray: #6b7280; --gray-bg: #eef0f3;
  --blue: #1d4ed8; --blue-bg: #e3ebff;
  --amber: #b45309; --amber-bg: #fdf0d9;
  --violet: #7c3aed; --violet-bg: #efe7ff;
  --green: #15803d; --green-bg: #dcf5e4;
  --red: #b91c1c; --red-bg: #fde4e4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1219; --surface: #171b24; --surface-2: #1e2330; --text: #e6e9ef; --muted: #9aa3b5;
    --border: #2a3040; --accent: #8b85ff; --shadow: none;
    --gray: #a3aab8; --gray-bg: #262c39;
    --blue: #8fb0ff; --blue-bg: #1c2a4d;
    --amber: #f5c46b; --amber-bg: #3a2c12;
    --violet: #c4a7ff; --violet-bg: #2e2247;
    --green: #77d99a; --green-bg: #15301f;
    --red: #ff9b9b; --red-bg: #3d1a1a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
nav.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
nav.tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.spacer { flex: 1; }
.alert { border: 0; cursor: pointer; background: var(--red-bg); color: var(--red); padding: 5px 12px; border-radius: 99px; font-weight: 600; }
.live { color: var(--muted); font-size: 12px; white-space: nowrap; }
.live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; }
.live.down i { background: var(--red); }

main { max-width: 1280px; margin: 0 auto; padding: 20px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
h2:first-child { margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.id { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.c-gray { color: var(--gray); background: var(--gray-bg); }
.c-blue { color: var(--blue); background: var(--blue-bg); }
.c-amber { color: var(--amber); background: var(--amber-bg); }
.c-violet { color: var(--violet); background: var(--violet-bg); }
.c-green { color: var(--green); background: var(--green-bg); }
.c-red { color: var(--red); background: var(--red-bg); }

.button { border: 1px solid var(--border); background: var(--surface); padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 12px; text-decoration: none; color: var(--text); }
.button:hover { border-color: var(--accent); color: var(--accent); }

/* Product */
.project-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.project-head p { margin: 4px 0 10px; }
.milestone { margin-top: 14px; }
.milestone-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.milestone-head h3 { margin: 0; font-size: 17px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--green); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; }
.feature h4 { margin: 2px 0 8px; font-size: 15px; cursor: pointer; }
.feature h4:hover { color: var(--accent); }
.feature.waiting { border-color: var(--red); }
.oks { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 4px; }
.oks li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.oks li.yes { color: var(--text); }
.oks .tick { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; border: 1.5px solid var(--border); }
.oks li.yes .tick { background: var(--green); border-color: var(--green); color: #fff; }
.oks li.now .tick { border-color: var(--red); color: var(--red); }
.table { width: 100%; border-collapse: collapse; }
.table td, .table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { font-size: 12px; color: var(--muted); font-weight: 600; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }

/* Construction */
.attention { border-color: var(--red); }
.attention + .attention { margin-top: 10px; }
.question { background: var(--surface-2); border-radius: 8px; padding: 4px 14px; margin-top: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.plain-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plain-list li { display: flex; gap: 8px; align-items: baseline; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; animation: pulse 1.4s infinite; position: relative; top: -1px; }
@keyframes pulse { 50% { opacity: .3; } }
.selector { display: flex; gap: 6px; flex-wrap: wrap; }
.selector button { border: 1px solid var(--border); background: var(--surface); padding: 4px 12px; border-radius: 99px; cursor: pointer; }
.selector button.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.feature-progress { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.feature-progress .card { padding: 10px 12px; cursor: pointer; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.column { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 120px; }
.column h5 { margin: 2px 4px 10px; font-size: 13px; display: flex; justify-content: space-between; }
.task { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); }
.task:hover { border-color: var(--accent); }
.task.working { border-left: 3px solid var(--amber); }
.task.waiting { border-left: 3px solid var(--red); }
.task.blocked { border-left: 3px solid var(--red); background: var(--red-bg); }
.task .title { font-weight: 600; margin: 2px 0 6px; }
.task .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }

/* Side panel */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 9; }
aside.side { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--surface); z-index: 10;
  border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.12); }
.side-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.side-head h3 { margin: 0; font-size: 17px; flex: 1; }
.side-tabs { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.side-tabs .active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.side-body { padding: 6px 22px 30px; overflow-y: auto; flex: 1; }
.close { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }

.md h1 { font-size: 20px; } .md h2 { font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--text); margin: 22px 0 8px; }
.md h3 { font-size: 14px; }
.md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.md pre { background: var(--surface-2); padding: 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--border); color: var(--muted); }
pre.plain { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; }

@media (max-width: 760px) {
  main { padding: 16px; }
  header.top { padding: 10px 16px; }
  .project-head, .two { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b id="name">factory</b><span id="subtitle">Panel de control</span></div>
  <nav class="tabs">
    <button data-view="product">Producto</button>
    <button data-view="construction">Construcción</button>
  </nav>
  <div class="spacer"></div>
  <span id="alert-slot"></span>
  <span class="live" id="live"><i></i>conectando…</span>
</header>
<main id="view"></main>
<div id="side-slot"></div>

<script>
// Code in English; labels shown to the user in Spanish.
const FEATURE_PHASE = {
  defined: ["En definición", "gray"], specified: ["Especificación aprobada", "blue"],
  building: ["En construcción", "amber"], validated: ["Validada · falta tu OK", "violet"],
  accepted: ["Aceptada", "green"], postponed: ["Aplazada", "gray"], discarded: ["Descartada", "gray"]
};
const MILESTONE_PHASE = { proposed: ["Propuesto", "gray"], approved: ["En marcha", "amber"], closed: ["Cerrado", "green"] };
const STATUS = {
  queued: ["En cola", "gray"], in_progress: ["Trabajando", "amber"],
  waiting_human: ["Te espera", "red"], blocked: ["Bloqueada", "red"]
};
const KIND = { cross_cutting: ["transversal", "blue"], fix: ["corrección", "amber"], hotfix: ["hotfix", "amber"] };
const COLUMNS = [["pending", "Pendiente"], ["development", "Desarrollo"], ["in_review", "En revisión"], ["done", "Hecha"]];
const ARTIFACT_LABEL = {
  vision: "Visión", roadmap: "Roadmap", architecture: "Arquitectura", spec: "Especificación",
  rules: "Reglas de negocio", mockup: "Maqueta ↗", design: "Diseño técnico", validation: "Validación",
  review: "Revisión", batch: "Lote"
};
const MODE_LABEL = {
  discovery: "Descubrimiento", base: "Arquitectura base", approve_milestone_first: "Aprobar hito (con visión, roadmap y arquitectura)",
  approve_milestone: "Aprobar hito", roadmap_review: "Revisar roadmap", open_release: "Abrir release",
  milestone: "Plan técnico del hito", specify: "Especificar", mockup: "Maqueta", approve_spec: "Aprobar especificación",
  feature: "Diseño técnico y tareas", fix: "Correcciones", feature_validation: "Validar funcionalidad",
  implement: "Implementar", resume: "Retomar", hotfix: "Hotfix", task_review: "Revisar PR",
  approve_merge: "Aprobar y fusionar PR", present_batch: "Lote de aceptación", close_milestone: "Cerrar hito"
};
const AGENT_LABEL = {
  orchestrator: "orquestador", analyst: "analista", prototyper: "prototipador", architect: "arquitecto",
  developer: "desarrollador", validator: "validador"
};
const PRIORITY_LABEL = { must: "imprescindible", should: "deseable", later: "más adelante" };
const FEATURE_ORDER = ["defined", "specified", "building", "validated", "accepted"];

let state = null, signature = "", selectedMilestone = null, side = null;
let view = ["product", "construction"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "product";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = t => window.marked ? marked.parse(t || "") : `<pre class="plain">${esc(t)}</pre>`;
const chip = ([t, c]) => `<span class="chip c-${c}">${esc(t)}</span>`;
const itemsOf = type => state.items.filter(e => e.meta.type === type);
const byId = id => id === "project" ? state.project : state.items.find(e => e.meta.id === id);
const agentLabel = a => AGENT_LABEL[a] || a;
const section = (body, title) => {
  const m = (body || "").match(new RegExp(`^## ${title}\\s*$([\\s\\S]*?)(?=^## |$(?![\\s\\S]))`, "m"));
  return m ? m[1].trim() : "";
};

async function load() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const txt = await r.text();
    $("#live").className = "live";
    if (txt !== signature) {
      signature = txt;
      state = JSON.parse(txt);
      render();
    }
    $("#live").innerHTML = `<i></i>en vivo · ${esc(state.generated.slice(11))}`;
  } catch (e) {
    $("#live").className = "live down";
    $("#live").innerHTML = "<i></i>sin conexión con factory panel";
  }
}

function render() {
  const p = state.project.meta;
  document.title = `${p.name || "Proyecto"} · factory`;
  $("#name").textContent = p.name || "Proyecto";
  $("#subtitle").textContent = p.description || "Panel de control";
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  const pending = [state.project, ...state.items].filter(e => ["waiting_human", "blocked"].includes(e.meta.status));
  $("#alert-slot").innerHTML = pending.length
    ? `<button class="alert" onclick="goTo('construction')">${pending.length} ${pending.length === 1 ? "cosa te espera" : "cosas te esperan"}</button>` : "";
  $("#view").innerHTML = view === "product" ? productView() : constructionView(pending);
  if (side) openSide(side.id, side.tab, true);
}

function goTo(v) { view = v; location.hash = v; render(); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => goTo(b.dataset.view));

function artifactButtons(e) {
  return Object.keys(e.artifacts || {}).map(k =>
    k === "mockup"
      ? `<a class="button" href="/artifact/${esc(e.artifacts[k])}" target="_blank">${ARTIFACT_LABEL[k]}</a>`
      : `<button class="button" onclick="event.stopPropagation(); openSide('${esc(e.meta.id)}', '${k}')">${ARTIFACT_LABEL[k] || k}</button>`
  ).join("");
}

/* ------------------------------------------------------------------ Product */
function productView() {
  const pr = state.project, p = pr.meta;
  const stack = section(pr.body, "Stack");
  const steps = [["Descubrimiento", p.discovery === "done"], ["Arquitectura base", p.architecture === "done"]];
  let h = `<h2>Producto</h2>
  <div class="card project-head">
    <div>
      <div class="row">${steps.map(([t, ok]) => chip([`${ok ? "✓" : "○"} ${t}`, ok ? "green" : "gray"])).join("")}
        ${chip([p.interface ? `Interfaz: ${p.interface}` : "Interfaz sin definir", "gray"])}
        ${chip([p.remote === "github" ? "GitHub" : "Solo local", "gray"])}
        ${p.language ? chip([`Idioma: ${p.language}`, "gray"]) : ""}</div>
      ${stack && !stack.startsWith("_") ? `<div class="md">${md(stack)}</div>` : `<p class="muted">El stack lo definirá el arquitecto en la arquitectura base.</p>`}
    </div>
    <div class="row">${artifactButtons(pr)}<button class="button" onclick="openSide('project')">Perfil</button></div>
  </div>`;

  const milestones = itemsOf("milestone");
  if (!milestones.length) h += `<h2>Hitos</h2><div class="empty">Aún no hay hitos. Saldrán del descubrimiento.</div>`;
  for (const m of milestones) {
    const fs = itemsOf("feature").filter(f => f.meta.milestone === m.meta.id);
    const alive = fs.filter(f => !["postponed", "discarded"].includes(f.meta.phase));
    const accepted = alive.filter(f => f.meta.phase === "accepted").length;
    h += `<div class="milestone">
      <h2>${esc(m.meta.id)} · hito</h2>
      <div class="milestone-head"><h3>${esc(m.meta.title)}</h3>${chip(MILESTONE_PHASE[m.meta.phase] || [m.meta.phase, "gray"])}
        ${m.meta.status === "waiting_human" ? chip(["Te espera: " + m.meta.reason, "red"]) : ""}
        <span class="spacer"></span>${artifactButtons(m)}
        <button class="button" onclick="openSide('${m.meta.id}')">Ficha</button></div>
      <div class="muted">Al terminar se puede: ${esc(m.meta.goal || "—")}</div>
      <div class="row" style="margin-top:8px"><div class="bar" style="flex:1"><div style="width:${alive.length ? accepted / alive.length * 100 : 0}%"></div></div>
        <span class="muted">${accepted}/${alive.length} aceptadas</span></div>
      <div class="grid">${fs.map(featureCard).join("") || `<div class="empty">Sin funcionalidades.</div>`}</div>
    </div>`;
  }

  h += `<h2>Decisiones</h2>`;
  h += state.decisions.length ? `<div class="card" style="padding:0"><table class="table">
    <tr><th>ID</th><th>Decisión</th><th>Sobre</th><th>Fecha</th></tr>
    ${[...state.decisions].reverse().map(d => `<tr class="clickable" onclick="openDecision('${esc(d.meta.id)}')">
      <td class="id">${esc(d.meta.id)}</td><td>${esc(d.meta.title)}</td><td class="id">${esc(d.meta.ref || "—")}</td><td class="muted">${esc(d.meta.date)}</td></tr>`).join("")}
  </table></div>` : `<div class="empty">Todavía no hay decisiones registradas.</div>`;
  return h;
}

function featureCard(f) {
  const m = f.meta, i = FEATURE_ORDER.indexOf(m.phase);
  const waiting = m.status === "waiting_human";
  const oks = [
    ["Especificación aprobada", i >= 1, m.phase === "defined" && waiting],
    ["Construida y validada", i >= 3, false],
    ["Aceptada por ti", i >= 4, m.phase === "validated" && waiting],
  ];
  return `<div class="card feature ${waiting ? "waiting" : ""}">
    <div class="row"><span class="id">${esc(m.id)}</span>${chip(FEATURE_PHASE[m.phase] || [m.phase, "gray"])}
      ${m.priority && m.priority !== "must" ? chip([PRIORITY_LABEL[m.priority] || m.priority, "gray"]) : ""}</div>
    <h4 onclick="openSide('${esc(m.id)}')">${esc(m.title)}</h4>
    ${waiting ? `<div>${chip(["Te espera: " + (m.reason || ""), "red"])}</div>` : ""}
    <ul class="oks">${oks.map(([t, yes, now]) => `<li class="${yes ? "yes" : ""} ${now ? "now" : ""}"><span class="tick">${yes ? "✓" : now ? "!" : ""}</span>${t}</li>`).join("")}</ul>
    <div class="row">${f.criteria != null ? `<span class="muted">${f.criteria} criterios de aceptación</span>` : `<span class="muted">Sin especificar todavía</span>`}</div>
    <div class="row" style="margin-top:10px">${artifactButtons(f)}</div>
  </div>`;
}

/* ------------------------------------------------------------------ Construction */
function constructionView(pending) {
  let h = `<h2>Te espera</h2>`;
  h += pending.length ? pending.map(e => {
    const m = e.meta, questions = section(e.body, "Pending questions");
    return `<div class="card attention">
      <div class="row"><span class="id">${esc(m.id)}</span>${chip(STATUS[m.status])}<b>${esc(m.title || m.name)}</b>
        <span class="spacer"></span>${artifactButtons(e)}<button class="button" onclick="openSide('${esc(m.id)}')">Ficha</button></div>
      <div style="margin-top:6px">${esc(m.reason || "")}</div>
      ${questions ? `<div class="question md">${md(questions)}</div>` : ""}
      <div class="muted" style="margin-top:8px">Responde en la terminal, al orquestador.</div>
    </div>`;
  }).join("") : `<div class="empty">Nada pendiente de ti.</div>`;

  const working = [state.project, ...state.items].filter(e => e.meta.status === "in_progress");
  h += `<div class="two"><div><h2>Trabajando ahora</h2><div class="card">${working.length
    ? `<ul class="plain-list">${working.map(e => `<li><span class="pulse"></span><span class="id">${esc(e.meta.id)}</span>
        <span>${esc(e.meta.title || "Proyecto")}${e.meta.agent ? ` <span class="muted">· ${esc(agentLabel(e.meta.agent))}</span>` : ""}</span></li>`).join("")}</ul>`
    : `<span class="muted">Ningún agente trabajando.</span>`}</div></div>
    <div><h2>Próximos pasos</h2><div class="card">${state.actions.length
    ? `<ul class="plain-list">${state.actions.map(a => `<li><span class="id">${esc(a.id)}</span>
        <span>${esc(MODE_LABEL[a.mode] || a.mode)} <span class="muted">· ${esc(agentLabel(a.who.replace("launch ", "")))}</span></span></li>`).join("")}</ul>`
    : `<span class="muted">Nada más hasta que respondas o terminen los agentes.</span>`}</div></div></div>`;

  const milestones = itemsOf("milestone");
  const active = milestones.find(x => x.meta.phase === "approved") || milestones[milestones.length - 1];
  if (!selectedMilestone || !byId(selectedMilestone)) selectedMilestone = active ? active.meta.id : null;
  const hotfixes = itemsOf("task").filter(t => t.meta.kind === "hotfix");
  if (!selectedMilestone && !hotfixes.length) return h + `<h2>Tareas</h2><div class="empty">Aún no hay hitos ni tareas.</div>`;

  if (selectedMilestone) {
    const ms = byId(selectedMilestone);
    h += `<h2>Hito</h2><div class="row">
      <div class="selector">${milestones.map(x => `<button class="${x.meta.id === selectedMilestone ? "active" : ""}" onclick="selectedMilestone='${x.meta.id}'; render()">${esc(x.meta.id)} · ${esc(x.meta.title)}</button>`).join("")}</div>
      <span class="spacer"></span>${chip(MILESTONE_PHASE[ms.meta.phase] || [ms.meta.phase, "gray"])}
      ${ms.meta.branch ? `<span class="id">${esc(ms.meta.branch)}</span>` : ""}</div>`;

    const tasks = itemsOf("task").filter(t => t.meta.milestone === selectedMilestone && t.meta.kind !== "hotfix");
    const fs = itemsOf("feature").filter(f => f.meta.milestone === selectedMilestone);
    h += `<h2>Funcionalidades</h2>`;
    h += fs.length ? `<div class="feature-progress">${fs.map(f => {
      const ts = tasks.filter(t => t.meta.parent === f.meta.id && t.meta.phase !== "discarded");
      const done = ts.filter(t => t.meta.phase === "done").length;
      return `<div class="card" onclick="openSide('${esc(f.meta.id)}')">
        <div class="row"><span class="id">${esc(f.meta.id)}</span>${chip(FEATURE_PHASE[f.meta.phase] || [f.meta.phase, "gray"])}</div>
        <div style="margin:4px 0 6px;font-weight:600">${esc(f.meta.title)}</div>
        <div class="row"><div class="bar" style="flex:1"><div style="width:${ts.length ? done / ts.length * 100 : 0}%"></div></div>
        <span class="muted">${ts.length ? `${done}/${ts.length} tareas` : "sin tareas"}</span></div></div>`;
    }).join("")}</div>` : `<div class="empty">Sin funcionalidades en este hito.</div>`;

    h += `<h2>Tareas</h2>` + kanban(tasks);
  }
  if (hotfixes.length) h += `<h2>Hotfix</h2>` + kanban(hotfixes);
  return h;
}

function kanban(tasks) {
  const alive = tasks.filter(t => t.meta.phase !== "discarded");
  return `<div class="kanban">${COLUMNS.map(([phase, title]) => {
    const ts = alive.filter(t => t.meta.phase === phase);
    return `<div class="column"><h5>${title}<span class="muted">${ts.length}</span></h5>${ts.map(taskCard).join("")}</div>`;
  }).join("")}</div>`;
}

function taskCard(t) {
  const m = t.meta;
  const cls = { in_progress: "working", waiting_human: "waiting", blocked: "blocked" }[m.status] || "";
  const pr = m.pr ? (state.prs_url ? `<a href="${esc(state.prs_url + m.pr)}" target="_blank" onclick="event.stopPropagation()">PR #${esc(m.pr)}</a>` : `PR #${esc(m.pr)}`) : "";
  const review = m.review === "ok" ? chip(["Revisión OK", "green"]) : m.review === "ko" ? chip(["Revisión KO", "red"]) : "";
  return `<div class="task ${cls}" onclick="openSide('${esc(m.id)}')">
    <div class="row"><span class="id">${esc(m.id)}</span>
      ${KIND[m.kind] ? chip(KIND[m.kind]) : ""}
      ${m.status && m.status !== "queued" ? chip(STATUS[m.status] || [m.status, "gray"]) : ""}</div>
    <div class="title">${esc(m.title)}</div>
    ${m.reason ? `<div class="muted" style="font-size:12px;margin-bottom:6px">${esc(m.reason)}</div>` : ""}
    <div class="meta">
      ${m.parent && m.parent !== "-" ? `<span class="id">${esc(m.parent)}</span>` : ""}
      ${m.package ? `<span>${esc(m.package)}</span>` : ""}
      ${m.agent ? `<span>· ${esc(agentLabel(m.agent))}</span>` : ""}
      ${Number(m.attempts) > 0 ? chip([`intento ${m.attempts}/${state.max_attempts}`, Number(m.attempts) >= state.max_attempts ? "red" : "gray"]) : ""}
      ${review} ${pr}
      ${(m.depends_on || []).length && m.phase === "pending" ? `<span>depende de ${esc(m.depends_on.join(", "))}</span>` : ""}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ Side panel */
async function openSide(id, tab = "card", refresh = false) {
  const e = byId(id);
  if (!e) { closeSide(); return; }
  if (tab === "mockup") { window.open(`/artifact/${e.artifacts.mockup}`, "_blank"); return; }
  side = { id, tab };
  const m = e.meta;
  const tabs = [["card", "Ficha"], ...Object.keys(e.artifacts || {}).map(k => [k, ARTIFACT_LABEL[k] || k])];
  let body;
  if (tab === "card") {
    body = itemCard(e);
  } else {
    try {
      const r = await fetch(`/artifact/${e.artifacts[tab]}`, { cache: "no-store" });
      body = `<div class="md">${md(await r.text())}</div>`;
    } catch (err) { body = `<div class="empty">No se pudo cargar.</div>`; }
  }
  const scroll = refresh && $(".side-body") ? $(".side-body").scrollTop : 0;
  $("#side-slot").innerHTML = sideHtml(m, tabs, tab, body);
  if (refresh) $(".side-body").scrollTop = scroll;
}

function sideHtml(m, tabs, tab, body) {
  const id = m.id;
  const phases = m.type === "feature" ? FEATURE_PHASE : m.type === "milestone" ? MILESTONE_PHASE : {};
  return `<div class="veil" onclick="closeSide()"></div>
  <aside class="side">
    <div class="side-head"><div style="flex:1"><div class="row"><span class="id">${esc(id)}</span>
      ${m.phase ? chip(phases[m.phase] || [m.phase, "gray"]) : ""}
      ${m.status ? chip(STATUS[m.status] || [m.status, "gray"]) : ""}</div>
      <h3>${esc(m.title || m.name || id)}</h3></div>
      <button class="close" onclick="closeSide()" aria-label="Cerrar">×</button></div>
    <div class="side-tabs">${tabs.map(([k, t]) => `<button class="button ${k === tab ? "active" : ""}" onclick="openSide('${esc(id)}', '${k}')">${t}</button>`).join("")}</div>
    <div class="side-body">${body}</div>
  </aside>`;
}

function itemCard(e) {
  const m = e.meta;
  const fields = Object.entries(m).filter(([k, v]) => !["id", "type", "title", "name"].includes(k) && v !== "" && !(Array.isArray(v) && !v.length));
  const h = `<table class="table" style="margin-top:12px">${fields.map(([k, v]) => `<tr><th style="width:150px">${esc(k)}</th><td>${
    k === "pr" && state.prs_url ? `<a href="${esc(state.prs_url + v)}" target="_blank">#${esc(v)}</a>` : esc(Array.isArray(v) ? v.join(", ") : v)}</td></tr>`).join("")}</table>`;
  return h + `<div class="md">${md(e.body.replace(/^\s*# .*\n/, ""))}</div>`;
}

function openDecision(id) {
  const d = state.decisions.find(x => x.meta.id === id);
  side = null;
  $("#side-slot").innerHTML = sideHtml({ id, title: d.meta.title }, [], "", `<p class="muted">Sobre ${esc(d.meta.ref || "—")} · ${esc(d.meta.date)}</p><div class="md">${md(d.body.replace(/^\s*# .*\n/, ""))}</div>`);
}

function closeSide() { side = null; $("#side-slot").innerHTML = ""; }
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeSide(); });

load();
setInterval(load, 2500);
</script>
</body>
</html>
